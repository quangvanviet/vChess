<!doctype html><html><head><meta charset="utf-8"><title>Gallery</title>
<style>body{margin:0;background:#bfe3ff;overflow:hidden}canvas{display:block}</style></head><body>
<script src="../js/vendor/three.min.js"></script>
<script src="../js/core/data.js"></script>
<script src="../js/ui/models.js"></script>
<script>
var TT=window.TT, THREE=window.THREE;
var W=innerWidth,H=innerHeight, r=new THREE.WebGLRenderer({antialias:true}); r.setSize(W,H); document.body.appendChild(r.domElement);
var sc=new THREE.Scene(); sc.background=new THREE.Color('#bfe3ff');
var cam=new THREE.PerspectiveCamera(30,W/H,.1,100);
sc.add(new THREE.HemisphereLight('#ffffff','#7aa86a',1.3)); var dl=new THREE.DirectionalLight('#fff4dd',2); dl.position.set(-3,6,5); sc.add(dl);
var grad=new THREE.DataTexture(new Uint8Array([110,110,110,255,190,190,190,255,245,245,245,255,255,255,255,255]),4,1,THREE.RGBAFormat); grad.needsUpdate=true; grad.minFilter=grad.magFilter=THREE.NearestFilter;
var mat=new THREE.MeshToonMaterial({vertexColors:true,gradientMap:grad});
var ol=new THREE.MeshBasicMaterial({color:'#5a4a62',vertexColors:true,side:THREE.BackSide}); ol.onBeforeCompile=function(sh){sh.vertexShader='attribute float olw;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n transformed += normalize(normal)*0.022*olw;');};
var q=new URLSearchParams(location.search), sel=q.get('race'), roles=q.get('roles')?q.get('roles').split(','):TT.ROLE_ORDER, races=sel?sel.split(','):TT.FACTION_ORDER;
var gap=+(q.get('gap')||1.5), items=[];
races.forEach(function(race,ri){ roles.forEach(function(role,ci){
  var m=TT.Models.get(race,role), g=new THREE.Group(); g.position.set((ci-(roles.length-1)/2)*gap,0,(ri-(races.length-1)/2)*gap*1.4); g.scale.setScalar(m.scale); g.rotation.y=+(q.get('rot')||0.5);
  for(var k in m.parts){ var p=m.parts[k], piv=new THREE.Group(); piv.position.set(p.pivot[0],p.pivot[1],p.pivot[2]); var mesh=new THREE.Mesh(p.geo,mat); piv.add(mesh); piv.add(new THREE.Mesh(p.geo,ol)); g.add(piv); items.push({k:k,piv:piv,p:p}); }
  sc.add(g);
});});
if(q.get('mon')) ['wolf','ox','treant'].forEach(function(k,i){ var m=TT.Models.monster(k), g=new THREE.Group(); g.position.set((i-1)*2.5,0,4); g.scale.setScalar(m.scale); for(var kk in m.parts){var p=m.parts[kk], piv=new THREE.Group(); piv.position.set(p.pivot[0],p.pivot[1],p.pivot[2]); var mesh=new THREE.Mesh(p.geo,mat); piv.add(mesh); piv.add(new THREE.Mesh(p.geo,ol)); g.add(piv);} sc.add(g); });
var ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshToonMaterial({color:'#9bd77f',gradientMap:grad})); ground.rotation.x=-Math.PI/2; sc.add(ground);
var dist=+(q.get('d')||(sel?9:16)); cam.position.set(0,dist*.55,dist); cam.lookAt(0,.4,0);
var t=+(q.get('t')||0.3);
items.forEach(function(it){ var k=it.k; if(k==='armR') it.piv.rotation.x=-.5; if(k==='legL') it.piv.rotation.x=.4; if(k==='legR') it.piv.rotation.x=-.4; if(k==='wingL') it.piv.rotation.y=-.4; if(k==='wingR') it.piv.rotation.y=.4; if(k[0]==='q') it.piv.rotation.x=(it.p.phase?.4:-.4); });
r.render(sc,cam); window.DONE=true;
</script></body></html>
