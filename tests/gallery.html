<!doctype html><html><head><meta charset="utf-8"><title>Gallery</title>
<style>body{margin:0;background:#bfe3ff;overflow:hidden}canvas{display:block}</style></head><body>
<script src="../js/vendor/three-bundle.min.js"></script>
<script src="../js/core/data.js"></script>
<script src="../js/ui/models.js"></script>
<script>
var TT=window.TT, THREE=window.THREE;
var W=innerWidth,H=innerHeight, r=new THREE.WebGLRenderer({antialias:true}); r.setSize(W,H); document.body.appendChild(r.domElement);
var sc=new THREE.Scene(); sc.background=new THREE.Color('#bfe3ff');
var cam=new THREE.PerspectiveCamera(30,W/H,.1,100);
sc.add(new THREE.HemisphereLight('#ffffff','#7aa86a',.35)); var dl=new THREE.DirectionalLight('#fff4dd',1.8); dl.position.set(-3,6,5); sc.add(dl);
r.toneMapping=THREE.ACESFilmicToneMapping; r.outputColorSpace=THREE.SRGBColorSpace;
var mat=new THREE.MeshStandardMaterial({vertexColors:true,flatShading:false,roughness:.7,metalness:0,envMapIntensity:.9});
mat.onBeforeCompile=function(sh){sh.vertexShader='attribute vec2 mr;\nvarying vec2 vMR;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n vMR=mr;');sh.fragmentShader='varying vec2 vMR;\n'+sh.fragmentShader.replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n roughnessFactor=vMR.y;').replace('#include <metalnessmap_fragment>','#include <metalnessmap_fragment>\n metalnessFactor=vMR.x;');};
var envReady=false; new THREE.RGBELoader().load('../assets/hdri/quarry_01_1k.hdr',function(t){t.mapping=THREE.EquirectangularReflectionMapping;var pm=new THREE.PMREMGenerator(r);sc.environment=pm.fromEquirectangular(t).texture;envReady=true;});
var ol=new THREE.MeshBasicMaterial({color:'#6a5262',vertexColors:true,side:THREE.BackSide}); ol.onBeforeCompile=function(sh){sh.vertexShader='attribute float olw;\nattribute vec3 onrm;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n transformed += normalize(onrm)*0.0135*olw;');};
var q=new URLSearchParams(location.search), sel=q.get('race'), roles=q.get('roles')?q.get('roles').split(','):TT.ROLE_ORDER, races=sel?sel.split(','):TT.FACTION_ORDER;
var gap=+(q.get('gap')||1.5), items=[];
races.forEach(function(race,ri){ roles.forEach(function(role,ci){
  var m=TT.Models.get(race,role,q.get('gen')==='1'||(q.get('gen')==='mix'&&ci%2===0)), g=new THREE.Group(); g.position.set((ci-(roles.length-1)/2)*gap,0,(ri-(races.length-1)/2)*gap*1.4); g.scale.setScalar(m.scale); g.rotation.y=+(q.get('rot')||0.5);
  for(var k in m.parts){ var p=m.parts[k], piv=new THREE.Group(); piv.position.set(p.pivot[0],p.pivot[1],p.pivot[2]); var mesh=new THREE.Mesh(p.geo,mat); piv.add(mesh); if(!q.get('noline'))piv.add(new THREE.Mesh(p.geo,ol)); g.add(piv); items.push({k:k,piv:piv,p:p}); }
  sc.add(g);
});});
if(q.get('mon')) ['wolf','ox','treant'].forEach(function(k,i){ var m=TT.Models.monster(k), g=new THREE.Group(); g.position.set((i-1)*2.5,0,4); g.scale.setScalar(m.scale); for(var kk in m.parts){var p=m.parts[kk], piv=new THREE.Group(); piv.position.set(p.pivot[0],p.pivot[1],p.pivot[2]); var mesh=new THREE.Mesh(p.geo,mat); piv.add(mesh); if(!q.get('noline'))piv.add(new THREE.Mesh(p.geo,ol)); g.add(piv);} sc.add(g); });
var ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:'#9bd77f',roughness:1})); ground.rotation.x=-Math.PI/2; sc.add(ground);
var dist=+(q.get('d')||(sel?9:16)); cam.position.set(0,dist*.55,dist); cam.lookAt(0,.4,0);
var t=+(q.get('t')||0.3);
items.forEach(function(it){ var k=it.k; if(k==='armR') it.piv.rotation.x=-.5; if(k==='legL') it.piv.rotation.x=.4; if(k==='legR') it.piv.rotation.x=-.4; if(k==='wingL') it.piv.rotation.y=-.4; if(k==='wingR') it.piv.rotation.y=.4; if(k[0]==='q') it.piv.rotation.x=(it.p.phase?.4:-.4); });
(function wait(){ if(!envReady) return setTimeout(wait,100); r.render(sc,cam); window.DONE=true; })();
</script></body></html>
